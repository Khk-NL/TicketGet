name: Ticket Core CI

on:
  push:
    branches: ["codex/unified-ticket-core"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use HTTPS for GitHub dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check bundled Android executor syntax
        run: python -m compileall -q src-tauri/resources/hatickets/mobile src-tauri/resources/hatickets/shared
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
