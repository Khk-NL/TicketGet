name: Release CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (for example, v0.7.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release-id: ${{ steps.release.outputs.result }}
      source-ref: ${{ steps.release.outputs.source-ref }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Create or reuse release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const tag = manual ? context.payload.inputs.tag : context.ref.replace('refs/tags/', '');
            const { version } = require('./package.json');
            if (tag !== `v${version}`) {
              throw new Error(`Tag ${tag} does not match package version ${version}`);
            }
            const platforms = [
              { platform: 'macos-latest', target: 'aarch64-apple-darwin', args: '--target aarch64-apple-darwin -- --locked' },
              { platform: 'macos-latest', target: 'x86_64-apple-darwin', args: '--target x86_64-apple-darwin -- --locked' },
              { platform: 'ubuntu-22.04', args: '-- --locked' },
              { platform: 'windows-latest', args: '-- --locked' },
            ];
            core.setOutput('source-ref', `refs/tags/${tag}`);
            core.setOutput('matrix', JSON.stringify({
              include: platforms,
            }));
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              });
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
              if (manual) throw new Error(`Release ${tag} must already exist for a rebuild`);
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `TicketGet ${tag} Preview`,
              draft: true,
              prerelease: true,
              body: [
                'Ticket Core 预览版：保留大麦和 Bilibili GUI，新增余票监控触发购票、大麦 Android UIAutomator2 执行器、设备与日志界面，并迁移本地凭据到系统安全存储保护的加密文件。',
                '',
                '安装包由 GitHub Actions 构建。真实 Android 设备上的页面识别、实际订单创建和微信送达尚未实测；付款仍需在官方页面人工完成。',
                '',
                '使用和真机验收步骤见仓库 README。',
              ].join('\n'),
            });
            return data.id;

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.create-release.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.source-ref }}
          persist-credentials: false
      - name: Use HTTPS for GitHub dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target || matrix.platform }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Check bundled Android executor syntax
        run: python -c "import ast,pathlib; root=pathlib.Path('src-tauri/resources/hatickets'); [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in root.rglob('*.py')]"
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish verified installers
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number('${{ needs.create-release.outputs.release-id }}'),
              draft: false,
              prerelease: true,
            });
