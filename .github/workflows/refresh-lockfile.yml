name: Refresh Rust lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-ticket-core
      - uses: dtolnay/rust-toolchain@stable
      - name: Update futures dependency
        run: cargo update -p futures-util --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.lock
          git diff --cached --quiet || git commit -m "chore: update futures for current Rust"
          git push origin HEAD:codex/unified-ticket-core
